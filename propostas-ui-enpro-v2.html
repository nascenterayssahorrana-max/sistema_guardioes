<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enpro JR · Três direções visuais</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#101713;--muted:#65706a;--line:#dde4df;--blue:#00a6d7;--green:#9ddd25;--yellow:#ffbc0d;--orange:#f24a16;--paper:#f7f9f7}*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:var(--ink);font-family:Manrope,Arial,sans-serif}.intro{max-width:1240px;margin:54px auto 30px;padding:0 24px}.intro h1{font:700 clamp(32px,5vw,58px)/1 Space Grotesk;margin:14px 0}.intro p{max-width:700px;color:var(--muted);font-size:16px;line-height:1.7}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.designs{max-width:1320px;margin:auto;padding:0 24px 64px;display:grid;gap:34px}.proposal{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 40px #1120180a}.proposal>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 18px}.proposal h2{margin:0;font:700 22px Space Grotesk}.proposal p{margin:4px 0 0;color:var(--muted);font-size:13px}.label{font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:7px 11px;background:var(--ink)}.app{min-height:570px;display:grid;grid-template-columns:210px 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.side{padding:20px 12px;border-right:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:14px}.brand img{width:33px;height:33px;object-fit:contain}.nav{display:grid;gap:4px}.nav button{appearance:none;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;padding:9px 10px;border-radius:9px;font:700 11px Manrope;color:#4f5a54}.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.nav .active{background:#e9f9fd;color:#08799e;box-shadow:inset 3px 0 #00a6d7}.content{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:start;gap:18px}.top h3{font:700 28px Space Grotesk;margin:0}.top p{margin:5px 0;color:var(--muted);font-size:13px}.button{border:0;border-radius:9px;padding:10px 13px;background:var(--ink);color:#fff;font:700 11px Manrope}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.metric{border:1px solid var(--line);border-radius:13px;padding:16px;min-height:110px}.metric small{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.metric strong{display:block;margin-top:14px;font:700 23px Space Grotesk}.metric i{font-style:normal;font-size:11px;color:var(--muted)}.chart{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:18px;height:210px}.chart h4{margin:0;font:700 15px Space Grotesk}.bars{height:130px;display:flex;align-items:end;gap:14%;padding:12px 12% 0}.bar{width:90px;border-radius:6px 6px 0 0;background:var(--blue)}.bar:nth-child(2){height:90%;background:var(--green)}.bar:nth-child(1){height:55%}.bar:nth-child(3){height:36%;background:var(--yellow)}.priorities{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.priority{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:11px;line-height:1.55}.priority b{display:block;font-size:12px;margin-bottom:5px}
/* A · taste-skill: grade assimétrica, uma cor de acento e tipografia espacial */.taste .app{grid-template-columns:76px 1fr;background:#fbfcfa}.taste .side{padding:18px 10px}.taste .brand{padding:0 0 24px;justify-content:center}.taste .brand em{display:none}.taste .nav button{font-size:0;height:38px;text-align:center}.taste .nav button::after{content:'◼';font-size:11px;color:#18221d}.taste .nav .active{background:#dff8ff}.taste .content{padding:38px}.taste .top{border-bottom:1px solid var(--line);padding-bottom:22px}.taste .top h3{font-size:34px}.taste .metrics{grid-template-columns:1.2fr .8fr .8fr 1.2fr}.taste .metric:first-child{background:var(--ink);border-color:var(--ink);color:#fff}.taste .metric:first-child small,.taste .metric:first-child i{color:#c9d0cb}.taste .chart{border-top:4px solid var(--blue)}
/* B · Operacional claro */.calm .app{background:#f6f8f6}.calm .side{background:#10211b;color:#fff;border:0}.calm .brand{color:#fff}.calm .nav button{color:#c5d1ca}.calm .nav .active{color:#10211b;background:var(--green);box-shadow:none}.calm .content{background:#f6f8f6}.calm .metric,.calm .chart,.calm .priority{background:#fff;border:0;box-shadow:0 8px 20px #1424180a}.calm .button{background:var(--green);color:#10211b}.calm .bar{background:#10211b}.calm .bar:nth-child(2){background:var(--green)}.calm .bar:nth-child(3){background:var(--orange)}
/* C · Informação editorial */.editorial .app{grid-template-columns:1fr}.editorial .side{display:flex;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:12px 20px}.editorial .brand{padding:0;margin-right:auto}.editorial .nav{display:flex;gap:2px;overflow:hidden}.editorial .nav button{white-space:nowrap;width:auto}.editorial .content{padding:34px 42px}.editorial .top h3{font-size:36px}.editorial .metrics{grid-template-columns:repeat(2,1fr)}.editorial .metric{border-radius:0;border-width:0 0 1px;padding:17px 0;min-height:auto}.editorial .chart{border-radius:0;border-width:1px 0;height:190px}.editorial .priorities{grid-template-columns:1fr 1fr 1fr}.editorial .priority{border-radius:0;border-width:0 0 0 2px}.editorial .priority:nth-child(1){border-color:var(--orange)}.editorial .priority:nth-child(2){border-color:var(--blue)}.editorial .priority:nth-child(3){border-color:var(--green)}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.metrics,.priorities{grid-template-columns:1fr 1fr}.content{padding:22px}.taste .app{grid-template-columns:1fr}.taste .side{display:block}.taste .nav button{font-size:11px;height:auto}.taste .nav button::after{content:''}.editorial .side{display:block}.editorial .nav{margin-top:12px}.editorial .content{padding:22px}}
</style></head><body><section class="intro"><span class="tag">Preview de identidade · nenhuma alteração no sistema</span><h1>Três direções para o ERP Enpro Jr.</h1><p>As três propostas cobrem a mesma estrutura de navegação e os principais tipos de tela: Visão Geral, Custos, Produtos, Estoque, Vendas, Perdas, Relatórios, DRE, CVL, Simulador, Análise e Usuários.</p></section><main class="designs" id="designs"></main><script>
const logo='file:///C:/Users/nasce/AppData/Local/Temp/codex-clipboard-f9ab3a8c-d1e2-452d-9766-60e5c0f55c26.png';const tabs=['Visão geral','Custos e precificação','Produtos','Estoque','Vendas e canais','Perdas','Relatórios gerenciais','DRE gerencial','Ponto de equilíbrio','Análise gerencial','Simulador','Usuários e permissões'];const data=[['taste','A · Sistema espacial','Direção guiada pelo taste-skill: minimalista, assimétrica e com azul Enpro como acento.'],['calm','B · Operação confiante','Navegação escura, conteúdo claro e verde Enpro para ações principais.'],['editorial','C · Informação editorial','Navegação horizontal e menos cards, priorizando ritmo tipográfico e leitura.']];document.querySelector('#designs').innerHTML=data.map(([c,n,d])=>`<article class="proposal ${c}"><header><div><h2>${n}</h2><p>${d}</p></div><span class="label">Prévia</span></header><section class="app"><aside class="side"><div class="brand"><img src="${logo}" alt="Logo Enpro Jr."><em>Enpro Jr.</em></div><nav class="nav">${tabs.map((t,i)=>`<button type="button" data-tab="${t}" class="${i===0?'active':''}" aria-pressed="${i===0}">${t}</button>`).join('')}</nav></aside><main class="content"><div class="top"><div><h3>Visão geral</h3><p>Situação executiva da operação no período selecionado.</p></div><button class="button">Ver relatório</button></div><section class="metrics">${[['Receita bruta','R$ 35.640'],['Margem de contribuição','29,1%'],['Resultado operacional','-R$ 27.331'],['Ponto de equilíbrio','R$ 129.584']].map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong><i>Período atual</i></div>`).join('')}</section><section class="chart"><h4>Evolução de receita</h4><div class="bars"><i class="bar"></i><i class="bar"></i><i class="bar"></i></div></section><section class="priorities"><div class="priority"><b>Resultado operacional</b>Causa, impacto e ação recomendada.</div><div class="priority"><b>Margem por canal</b>Leitura objetiva do período.</div><div class="priority"><b>Próxima decisão</b>Informação sem excesso visual.</div></section></main></section></article>`).join('');
const previews={
  'Visão geral':['Situação executiva da operação no período selecionado.','Ver relatório','Evolução de receita'],
  'Custos e precificação':['Custo real, margem e preço dos produtos por canal.','Ver margens','Margem por canal'],
  'Produtos':['Cadastro e rentabilidade do portfólio.','Ver produtos','Mix de produtos'],
  'Estoque':['Saldos físicos e controle de movimentações.','Ver estoque','Cobertura por insumo'],
  'Vendas e canais':['Receita e volume do varejo e atacado.','Ver vendas','Receita por canal'],
  'Perdas':['Acompanhamento dos registros e impacto no resultado.','Ver perdas','Perdas por semana'],
  'Relatórios gerenciais':['Leitura consolidada, filtros e decisões do período.','Exportar CSV','Receita e margem'],
  'DRE gerencial':['Demonstrativo de resultado com leitura objetiva.','Ver DRE','Composição do resultado'],
  'Ponto de equilíbrio':['Volume necessário para cobrir a estrutura atual.','Simular','Meta de volume'],
  'Análise gerencial':['Prioridades operacionais e decisões recomendadas.','Ver análise','Prioridades da semana'],
  'Simulador':['Avalie cenários sem alterar a base real.','Abrir simulador','Impacto do cenário'],
  'Usuários e permissões':['Acessos e papéis da equipe do sistema.','Gerenciar acessos','Distribuição de perfis']
};
document.querySelectorAll('.proposal').forEach((proposal)=>{proposal.querySelectorAll('[data-tab]').forEach((button)=>button.addEventListener('click',()=>{const title=button.dataset.tab;const [copy,action,chart]=previews[title];proposal.querySelectorAll('[data-tab]').forEach((item)=>{item.classList.toggle('active',item===button);item.setAttribute('aria-pressed',String(item===button))});proposal.querySelector('.top h3').textContent=title;proposal.querySelector('.top p').textContent=copy;proposal.querySelector('.button').textContent=action;proposal.querySelector('.chart h4').textContent=chart}))});</script></body></html>
